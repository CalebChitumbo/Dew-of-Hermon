<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none" role="img" aria-label="Tabernacle of David Assembly">
  <title>Tabernacle of David Assembly — City Mission Church</title>
  <g fill="#C8963E">
    <!-- Cross (top) -->
    <rect x="48" y="6" width="14" height="80" rx="1" />
    <rect x="30" y="22" width="50" height="12" rx="1" />

    <!-- Key shaft -->
    <rect x="48" y="86" width="14" height="44" rx="1" />

    <!-- Key bow (circle with inner cut) -->
    <circle cx="55" cy="134" r="20" />
    <circle cx="55" cy="134" r="9" fill="#FFF8F0" />

    <!-- Key teeth -->
    <rect x="62" y="100" width="14" height="8" rx="1" />
    <rect x="62" y="114" width="10" height="8" rx="1" />
  </g>
</svg>

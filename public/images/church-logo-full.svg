<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" fill="none" role="img" aria-label="Tabernacle of David Assembly — City Mission Church">
  <title>Tabernacle of David Assembly — City Mission Church</title>
  <g fill="#C8963E">
    <!-- Cross (top) -->
    <rect x="42" y="14" width="20" height="118" rx="2" />
    <rect x="14" y="38" width="76" height="18" rx="2" />

    <!-- Key shaft -->
    <rect x="42" y="132" width="20" height="62" rx="2" />

    <!-- Key bow -->
    <circle cx="52" cy="220" r="30" />
    <circle cx="52" cy="220" r="13" fill="#FFF8F0" />

    <!-- Key teeth -->
    <rect x="62" y="148" width="22" height="12" rx="2" />
    <rect x="62" y="168" width="16" height="12" rx="2" />
  </g>

  <g font-family="DM Serif Display, Georgia, serif" fill="#C8963E">
    <text x="120" y="100" font-size="56" font-weight="700">Tabernacle</text>
    <text x="120" y="160" font-size="56" font-weight="700">of David Assembly</text>
  </g>
  <text x="120" y="200" font-family="DM Sans, Helvetica, sans-serif" font-size="28" fill="#C8963E">City Mission Church</text>
</svg>

# Builds the Potter's Wheel Android app and attaches the APK to a GitHub
# pre-release so it can be downloaded and installed straight from a phone.
#
# Runs on every push that touches mobile/ on the mobile dev branch, and can
# also be started manually from the Actions tab.
name: Build mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/amazing-volta-tgudy1
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        run: |
          git clone --depth 1 -b 3.44.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: potters-wheel-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk potters-wheel.apk
          gh release create "mobile-test-${{ github.run_number }}" potters-wheel.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Potter's Wheel Android test build #${{ github.run_number }}" \
            --notes "Test build of the mobile app from \`${{ github.ref_name }}\`. Download **potters-wheel.apk** below on an Android phone, open it, allow the install, and sign in with your website account."

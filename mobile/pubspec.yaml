name: dew_of_hermon
description: Dew of Hermon — youth ministry management for Tabernacle of David Assembly.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.4
  google_sign_in: ^6.2.1

  # ── State & navigation ──
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # ── Networking ──
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # ── Storage ──
  shared_preferences: ^2.2.3

  # ── UI ──
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.4
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.2.6

  # ── QR & scanning ──
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # ── PDF ──
  pdf: ^3.10.8
  printing: ^5.12.0

  # ── Notifications ──
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/dashboard/
    - assets/images/login-features/
    - assets/images/fundraising/
    - assets/images/rops-camp/
    - assets/icons/

  # ── Bundled fonts (opt-in, for a fully offline build) ────────────────────
  # By default the app loads DM Sans / DM Serif Display / Cinzel / Fraunces /
  # Manrope through the `google_fonts` package, which downloads each family
  # once and then caches it in app storage — so camp works offline after a
  # single online launch.
  #
  # To bundle the TTFs instead (no first-run download at all):
  #   1. bash tool/fetch_fonts.sh          # downloads into assets/fonts/
  #   2. uncomment the `fonts:` block below
  #   3. set kUseBundledFonts = true in lib/core/theme/app_theme.dart
  #
  # fonts:
  #   - family: DM Serif Display
  #     fonts:
  #       - asset: assets/fonts/DMSerifDisplay-Regular.ttf
  #   - family: DM Sans
  #     fonts:
  #       - asset: assets/fonts/DMSans-Regular.ttf
  #       - asset: assets/fonts/DMSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/DMSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/DMSans-Bold.ttf
  #         weight: 700
  #   - family: Cinzel
  #     fonts:
  #       - asset: assets/fonts/Cinzel-Regular.ttf
  #       - asset: assets/fonts/Cinzel-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Cinzel-Bold.ttf
  #         weight: 700
  #   - family: Fraunces
  #     fonts:
  #       - asset: assets/fonts/Fraunces-Regular.ttf
  #       - asset: assets/fonts/Fraunces-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Fraunces-Bold.ttf
  #         weight: 700
  #   - family: Manrope
  #     fonts:
  #       - asset: assets/fonts/Manrope-Regular.ttf
  #       - asset: assets/fonts/Manrope-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Manrope-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Manrope-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon-512.png"
  adaptive_icon_background: "#FFF8F0"
  adaptive_icon_foreground: "assets/icons/icon-512.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFF8F0"
  image: assets/icons/icon-512.png
  android_12:
    color: "#FFF8F0"
    image: assets/icons/icon-512.png

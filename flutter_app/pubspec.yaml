name: dew_of_hermon
description: "Dew of Hermon Youth Ministry — Tabernacle of David Assembly, City Mission Church"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase — same project as the web app
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # HTTP client with the session-cookie flow the web API expects
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # App architecture
  provider: ^6.1.2
  go_router: ^14.3.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # QR — camp passes, meal badges, check-in
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # PDFs — Latreuo cycle document, event report exports, camp QR tags
  pdf: ^3.11.1
  printing: ^5.13.3

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

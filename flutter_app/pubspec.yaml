name: dew_of_hermon
description: Dew of Hermon Youth Ministry — Tabernacle of David Assembly, City Mission Church.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19
  firebase_storage: ^11.6.9

  # Google sign-in (parity with web auth providers)
  google_sign_in: ^6.2.1

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^13.2.1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
